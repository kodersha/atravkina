name: Sync from hosting

on:
  schedule:
    - cron: '0 21 * * *'   # каждый день в 21:00 UTC (02:00 по Алматы)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Download folders from hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          mirror --delete --exclude-glob media /domains/atravkina.ru/public_html/content ./content
          mirror --delete /domains/atravkina.ru/public_html/content/media ./media
          quit
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content media
          git diff --cached --quiet || git commit -m "Sync from hosting $(date +%F)"
          git push
