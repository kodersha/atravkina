name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Compile SCSS and upload site via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dart Sass
        run: npm install --global sass

      - name: Compile SCSS
        run: |
          sass --version
          sass --style=compressed --no-source-map --quiet-deps \
            system/themes/src/build.scss \
            system/themes/custom.css

      - name: Prepare deployment files
        run: |
          mkdir -p "$RUNNER_TEMP/site-deploy"
          rsync -a ./ "$RUNNER_TEMP/site-deploy/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='content/' \
            --exclude='favicon/' \
            --exclude='media/' \
            --exclude='README.md' \
            --exclude='GITHUB_SYNC_CRON.md' \
            --exclude='system/themes/src/' \
            --exclude='system/themes/custom.css.map' \
            --exclude='system/extensions/yellow-likes/' \
            --exclude='system/trash/'

      - name: Configure SSH
        env:
          SFTP_KEY: \${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: \${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH access and remote rsync
        env:
          SFTP_HOST: \${{ secrets.SFTP_HOST }}
          SFTP_USER: \${{ secrets.SFTP_USER }}
          SFTP_PORT: \${{ secrets.SFTP_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$SFTP_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SFTP_USER@$SFTP_HOST" \
            'command -v rsync'

      - name: Upload files via rsync over SSH
        env:
          SFTP_HOST: \${{ secrets.SFTP_HOST }}
          SFTP_USER: \${{ secrets.SFTP_USER }}
          SFTP_PORT: \${{ secrets.SFTP_PORT }}
          SFTP_PATH: \${{ secrets.SFTP_PATH }}
        run: |
          rsync -avz \
            --no-perms \
            --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -p $SFTP_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$RUNNER_TEMP/site-deploy/" \
            "$SFTP_USER@$SFTP_HOST:$SFTP_PATH/"
